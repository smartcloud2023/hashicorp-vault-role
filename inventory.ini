# ansible_host = public IP that Ansible uses for SSH
# private_ip   = AWS private IP that Vault uses between servers (recommended).
#                Find them with:  ansible all -m command -a "hostname -I" -b
#                then remove the "#" and fill them in. If not set, the public IP is used.

[transit]
transit-1 ansible_host=54.215.156.47   #private_ip=

[vault]
vault-1 ansible_host=3.101.103.241     #private_ip=
vault-2 ansible_host=54.193.110.134    #private_ip=
vault-3 ansible_host=54.193.32.115     #private_ip=

[lb]
lb-1 ansible_host=54.241.130.233       #private_ip=

# Use sudo on the servers only (NOT on Master-Node / localhost)
[servers:children]
transit
vault
lb

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/sonarkey1.pem

[servers:vars]
ansible_become=true

# Everything uses PRIVATE IPs (traffic stays inside the AWS VPC).
# Only the load balancer is reached publicly: point group3assessment.online at its public IP.
# Master-Node must be in the same VPC to reach these private IPs.

[transit]
transit-1 ansible_host=172.31.29.77

[vault]
vault-1 ansible_host=172.31.31.78
vault-2 ansible_host=172.31.24.191
vault-3 ansible_host=172.31.30.58

[lb]
lb-1 ansible_host=172.31.24.235 public_ip=54.215.67.35

# Use sudo on the servers only (NOT on Master-Node / localhost)
[servers:children]
transit
vault
lb

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/sonarkey1.pem

[servers:vars]
ansible_become=true

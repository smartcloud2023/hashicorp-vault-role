---
# Simple Vault: 1 transit node + 3 Vault voters + HAProxy, built from roles.
# Public URL: Let's Encrypt on HAProxy. Internally: self-signed TLS between every server.
# Run everything:      ansible-playbook site.yml
# Run one step:        ansible-playbook site.yml --tags certs
#   tags: certs, install, transit, vault, lb, check  (combine: --tags certs,install)
# Move old secrets/ files to AWS Secrets Manager:  ansible-playbook site.yml --tags aws-secrets

- name: Step 1 - Create TLS certificates (on your machine)
  tags: [certs]
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  roles:
    - certs

- name: Move existing secrets from Master-Node to AWS Secrets Manager (one-off)
  tags: [never, aws-secrets]
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  roles:
    - aws_secrets

- name: Step 2 - Install Vault
  tags: [install]
  hosts: transit:vault
  roles:
    - vault_install

- name: Step 3 - Set up the transit node
  tags: [transit]
  hosts: transit
  module_defaults:
    ansible.builtin.uri:
      ca_path: /etc/vault.d/tls/ca.crt
  roles:
    - transit

- name: Step 4 - Set up the 3 Vault nodes
  tags: [vault]
  hosts: vault
  module_defaults:
    ansible.builtin.uri:
      ca_path: /etc/vault.d/tls/ca.crt
  roles:
    - vault_cluster

- name: Step 5 - Set up HAProxy with Let's Encrypt
  tags: [lb]
  hosts: lb
  roles:
    - haproxy

- name: Step 6 - Check the cluster (on your machine)
  tags: [check]
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  roles:
    - check

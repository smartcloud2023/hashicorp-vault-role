---
- name: List the Raft peers through the load balancer
  ansible.builtin.uri:
    url: "https://{{ public_domain }}/v1/sys/storage/raft/configuration"
    headers:
      X-Vault-Token: "{{ (query('amazon.aws.aws_secret', check_sm_keys, region=aws_region, on_missing='error') | first | default('') | from_json).root_token }}"
  register: check_peers
  no_log: true

- name: Show the cluster
  ansible.builtin.debug:
    msg: "{{ item.node_id }}  leader={{ item.leader }}  voter={{ item.voter }}"
  loop: "{{ check_peers.json.data.config.servers }}"
  loop_control:
    label: "{{ item.node_id }}"

- name: Done
  ansible.builtin.debug:
    msg: "Vault is ready at https://{{ public_domain }}  (keys are in AWS Secrets Manager under {{ aws_secret_prefix }}/)"

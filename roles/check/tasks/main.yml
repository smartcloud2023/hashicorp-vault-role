---
- name: List the Raft peers through the load balancer
  ansible.builtin.uri:
    url: "https://{{ public_domain }}/v1/sys/storage/raft/configuration"
    headers:
      X-Vault-Token: "{{ (lookup('file', secrets_dir ~ '/vault-keys.json') | from_json).root_token }}"
  register: check_peers

- name: Show the cluster
  ansible.builtin.debug:
    msg: "{{ item.node_id }}  leader={{ item.leader }}  voter={{ item.voter }}"
  loop: "{{ check_peers.json.data.config.servers }}"
  loop_control:
    label: "{{ item.node_id }}"

- name: Done
  ansible.builtin.debug:
    msg: "Vault is ready at https://{{ public_domain }}  (keys are in {{ secrets_dir }} - move them somewhere safe)"
